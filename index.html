<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">WikiSearch</h1>
        </div>
        
        <div class="search-container">
            <div class="search-input-and-select">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search Wikipedia articles..." autocomplete="off">
                    <button id="searchBtn" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                </div>
                
                <div class="options-container">
                    <select id="modelSelect" class="model-select">
                        <option value="tfidf">Tfidf</option>
                        <option value="semantic">Semantic</option>
                        <option value="bm25">BM25</option>
                        <option value="hybrid">Hybrid</option>
                    </select>
                </div>
            </div>

            <div id="spellingSuggestion" class="spelling-suggestion hidden">
                Did you mean: <a href="#" id="suggestionLink"></a>
            </div>
            <div class="search-buttons">
                <button id="searchButton" class="btn">Search</button>
            </div>
        </div>

        <div id="loadingSpinner" class="loading hidden">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>

        <div id="resultsContainer" class="results-container">
            <div id="resultsHeader" class="results-header hidden">
                <p id="resultsCount"></p>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>
